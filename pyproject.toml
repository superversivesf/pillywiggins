[project]
name = "pillywiggins"
version = "0.1.0"
description = "A council of AI agents, not a chatbot with multiple faces."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic-ai",
    "asyncpg",
    "redis[hiredis]",
    "nats-py",
    "python-telegram-bot",
    "apscheduler",
    "pydantic-settings",
    "pydantic",
    "aiohttp",
    "watchfiles",
]

[project.scripts]
pillywiggins = "pillywiggins.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pillywiggins"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]