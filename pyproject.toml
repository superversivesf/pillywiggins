[project]
name = "pillywiggins"
version = "0.3.0"
description = "A council of AI agents, not a chatbot with multiple faces."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic-ai",
    "asyncpg",
    "redis[hiredis]",
    "nats-py",
    "python-telegram-bot",
    "discord.py",
    "slack-bolt",
    "matrix-nio",
    "aiosmtplib",
    "imap-tools",
    "apscheduler",
    "pydantic-settings",
    "pydantic",
    "aiohttp",
    "watchfiles",
    "questionary>=2.0",
    "pgvector>=0.2.4",
    "sentence-transformers",
    "mcp>=1.0.0",
]

[project.scripts]
pillywiggins = "pillywiggins.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pillywiggins"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-postgresql>=6.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["src", ".venv", ".git", "node_modules"]
markers = [
    "unit: Fast mocked unit tests (default)",
    "integration: Tests requiring real Docker infrastructure",
    "smoke: Fast infrastructure health checks",
    "skip: stub test for unimplemented module",
]

[tool.coverage.run]
source = ["src/pillywiggins"]
omit = [
    "tests/*",
    "*/__main__.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]