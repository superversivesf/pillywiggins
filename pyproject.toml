[project]
name = "pillywiggins"
version = "0.1.0"
description = "A council of AI agents, not a chatbot with multiple faces."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic-ai",
    "asyncpg",
    "redis[hiredis]",
    "nats-py",
    "python-telegram-bot",
    "apscheduler",
    "pydantic-settings",
    "pydantic",
    "aiohttp",
    "watchfiles",
]

[project.scripts]
pillywiggins = "pillywiggins.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pillywiggins"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "skip: stub test for unimplemented module",
]

[tool.coverage.run]
source = ["src/pillywiggins"]
omit = [
    "tests/*",
    "*/__main__.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]